<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Cat face - one continuous line outline -->
  <path d="M6 24 C6 10 14 2 24 4 C34 2 42 10 42 24 C42 34 36 42 28 42 C22 42 20 40 20 38"
        stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left ear -->
  <path d="M12 20 L6 4 L22 12" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right ear -->
  <path d="M36 20 L42 4 L26 12" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Eyes -->
  <circle cx="17" cy="22" r="2" fill="#1e293b"/>
  <circle cx="31" cy="22" r="2" fill="#1e293b"/>
  <!-- Nose -->
  <path d="M22 27 L24 29 L26 27" stroke="#1e293b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Mouth with math function curve -->
  <path d="M18 32 Q22 37 24 32 Q26 37 30 32 Q34 27 40 28 T46 24"
        stroke="#1e293b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Whiskers -->
  <line x1="3" y1="28" x2="13" y2="29" stroke="#1e293b" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="3" y1="32" x2="13" y2="32" stroke="#1e293b" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="28" y1="38" x2="20" y2="37" stroke="#1e293b" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="28" y1="40" x2="21" y2="39" stroke="#1e293b" stroke-width="1.2" stroke-linecap="round"/>
</svg>
